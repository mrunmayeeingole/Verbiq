
<header>
  <nav class="navbar navbar-expand-lg bg-body fixed-top">
      <div class="container-fluid justify-content-center">
          <a class="navbar-brand" href="#">
              <img src="/assets/images/logo.svg" 
                   alt="Logo" 
                   class="bd-placeholder-img rounded-0"  style="width: 200px; max-height: 100px;" 
                   >
          </a>
      </div>
  </nav>
</header>
<body>
    <section class="vh-100">
        <div class="container py-5 h-100">
          <div class="row d-flex align-items-center justify-content-center h-100">
            <div class="col-md-8 col-lg-7 col-xl-6">
              <img src="/assets/images/Frame.svg" width="400" height="300" class="img-fluid" alt="Sign-in image">
            </div>
            <div class="col-md-7 col-lg-5 col-xl-5 offset-xl-1">
              <!-- Form -->
              <form [formGroup]="newForm">
                <!-- Candidate Registration Number -->
                <div class="form-outline my-3">
                  <label for="registrationNumber" class="mb-2">Candidate Registration Number</label>
                  <input
                    type="text"
                    id="registrationNumber"
                    formControlName="registrationNumber"
                    class="form-control form-control-lg"
                    required
                    placeholder="Enter your registration number"
                  />
                </div>
              
                <!-- Password -->
                <div class="form-outline my-3">
                  <label for="password" class="mb-2">Password</label>
                  <input
                    type="password"
                    id="password"
                    formControlName="password"
                    class="form-control form-control-lg"
                    required
                    placeholder="**********"
                  />
                </div>
              
                <!-- Sign-In Button -->
                <div class="text-center my-4">
                  <button
                    type="submit"
                    class="btn btn-danger w-100"
                    (click)="onSubmit()"
                    [disabled]="newForm.invalid"
                  >
                    Sign-In
                  </button>
                </div>
              
                <!-- Help Link -->
                <div class="text-end">
                  <a [routerLink]="['/auth/sign-up']"   class="text-decoration-none" style="color: #004422;">Trouble signing in?</a>
                </div>
              </form>
            </div>
          </div>
        </div>
      </section>
      

 
    <script
      type="text/javascript"
      src="https://cdnjs.cloudflare.com/ajax/libs/mdb-ui-kit/6.4.0/mdb.min.js"
    ></script>
</body>
