<div class="">
  <div class="proficiency-chart-container">
    <canvas #proficiencyChart></canvas>
  </div>
</div>

<div class="assessment-results">
  <h3>Language Assessment Data</h3>
  <table class="table table-bordered">
    <thead>
      <tr>
        <th>Category</th>
      </tr>
    </thead>
    <tbody>
      <ng-container *ngFor="let item of assessmentResults; let i = index">
        <!-- Insert blank row after the first row and then after every two rows -->
        <tr *ngIf="i === 1 || (i > 1 && (i - 1) % 2 === 0)">
          <td></td> <!-- Blank row -->
        </tr>
        <tr>
          <td>{{ item.title }}</td>
        </tr>
      </ng-container>
    </tbody>
  </table>
</div>
<button
  [routerLink]="['/pages/final-submit']"
  routerLinkActive="router-link-active"
  class="submit-btn"
>
  Continue
</button>
