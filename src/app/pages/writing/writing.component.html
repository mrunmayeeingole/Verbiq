<div class="container-fluid">
  <div class="row m-0 p-0">
    <div class="col-6 col-lg-6">
      <h2 class="fw-normal textColor border-title py-3">
        {{ questionDetails?.heading }}
      </h2>
    </div>
    <div class="col-6 col-lg-6">
      <p class="text-end text-muted p-3" style="font-size: 16px">
        {{ remainingTime }}
      </p>
    </div>
  </div>
  <div *ngIf="questionDetails?.questionType === 'text'" class="paragraph-box p-3">
    <p class="justified-text fw-medium mt-5 no-copy" preventRightClick>
      {{ questionDetails?.question }}
    </p>
    <!-- <select (change)="onKeyboardChange($event)">
      <option value="us">English (US)</option>
      <option value="japanese">Japanese - Kana</option>
      <option value="french">French</option>
      <option value="spanish">Spanish</option>
      <option value="german">German</option>
      <option value="italian">Italian</option>
    </select> -->
    
    <textarea class="form-control w-100 mt-5" [(ngModel)]="answerText" rows="6" placeholder="Type your translation here"></textarea>
    <!-- <div id="KeymanWebControl"></div> -->
  </div>
  
  <div *ngIf="questionDetails?.questionType === 'mcq'" class="paragraph-box p-2">
    <div class="px-4">
      <div *ngIf="questionDetails.passage" class="justified-text passage-text mb-3 no-copy" preventRightClick>
        {{ questionDetails?.passage }}
      </div>
      <div class="question-text mb-4 no-copy" preventRightClick>
        {{ questionDetails?.question }}
      </div>
      <div class="mcq-container">
        <div *ngFor="let option of questionDetails?.options; let i = index">
          <div 
            class="mcq-option"
            (click)="onOptionSelect(option)"
            [class.selected]="selectedAnswer === option?.optionText">
            <span class="option-letter">{{ ['A', 'B', 'C', 'D'][i] }}</span>
            <span class="option-text">{{ option?.optionText }}</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="row">
    <div class="text-center">
      <div class="d-flex justify-content-center justify-content-between ms-5 mt-5" style="width: 50%">
        <button 
        class="btn btn-light border mt-2">
        &nbsp;
        <i class="bi bi-bookmark-fill" style="color:#b0181b"></i>&nbsp;
        Bookmark
      </button>
        <!-- <button 
        *ngIf="questionDetails?.questionType === 'mcq'" 
        class="btn btn-light border mt-2">
        &nbsp;
        <i class="bi bi-bookmark-fill" style="color:#b0181b"></i>&nbsp;
        Bookmark
      </button> -->
        <button 
        (click)="verifyQuestion()" 
        class="btn btn-danger mt-2 ms-5"
        [disabled]="(questionDetails?.questionType === 'mcq' && !selectedAnswer) || (questionDetails?.questionType !== 'mcq' && (!answerText || !answerText.trim()))">
        Submit
      </button>
      </div>
    </div>
  </div>
  <div *ngIf="showToast" class="custom-toast">
    ⚠️ Only 1 minute remaining!
  </div>
</div>
<app-loader [isLoading]="loading"></app-loader>
